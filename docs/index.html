<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS</title>
<style>
  :root{
    --bg:#020203;
    --bg2:#0b0b0e;
    --panel:#0f0f13;
    --silver:#b8bfc9;
    --silver-bright:#eef0f4;
    --silver-dim:#5a606b;
    --purple:#8b7cff;
    --cyan:#2dd4ff;
    --glow: rgba(190,200,220,0.45);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    height:100%;
    background:var(--bg);
    color:var(--silver-bright);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    overflow-x:hidden;
  }
  .mono{ font-family: "SF Mono","Cascadia Code","Consolas",monospace; letter-spacing:2px; }
  .hidden{ display:none !important; }

  /* ============ BOOT SCREEN ============ */
  #boot-screen{
    position:fixed; inset:0; z-index:100;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:radial-gradient(circle at 50% 40%, #101014 0%, #020203 75%);
    transition:opacity .5s ease;
  }
  #boot-screen.fade-out{ opacity:0; }
  .boot-title{
    font-size:clamp(2.2rem,9vw,4.5rem);
    font-weight:700;
    background:linear-gradient(120deg,var(--silver-dim),var(--silver-bright) 45%,var(--purple) 60%,var(--silver-bright) 80%,var(--silver-dim));
    background-size:250% 100%;
    -webkit-background-clip:text; background-clip:text; color:transparent;
    animation: shimmer 3s linear infinite;
  }
  @keyframes shimmer{ 0%{background-position:0% 0;} 100%{background-position:250% 0;} }
  .boot-line{ width:min(70vw,420px); height:1px; margin:22px 0;
    background:linear-gradient(90deg,transparent,var(--silver),var(--purple),var(--silver),transparent); }
  .boot-sub{ font-size:.8rem; color:var(--silver); opacity:.85; animation:blink 1.1s ease-in-out infinite; }
  @keyframes blink{ 0%,100%{opacity:.15;} 50%{opacity:.9;} }
  .boot-footer{ position:absolute; bottom:26px; font-size:.7rem; color:var(--silver-dim); letter-spacing:3px; }

  /* ============ ACTIVATION SCREEN ============ */
  #activation-screen{
    position:fixed; inset:0; z-index:90;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:28px;
    background:radial-gradient(circle at 50% 45%, #101014 0%, #020203 75%);
  }
  .act-title{
    font-size:clamp(2rem,8vw,3.6rem); font-weight:700;
    background:linear-gradient(120deg,var(--silver-dim),var(--silver-bright),var(--purple));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  #activateBtn{
    padding:16px 34px; font-size:1rem; letter-spacing:2px; font-weight:600;
    background:linear-gradient(135deg,#1a1a20,#08080a);
    color:var(--silver-bright); border:1px solid var(--silver-dim); border-radius:50px;
    cursor:pointer; box-shadow:0 0 24px var(--glow);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  #activateBtn:hover{ box-shadow:0 0 40px var(--glow); transform:translateY(-2px); }
  .act-hint{ font-size:.75rem; color:var(--silver-dim); letter-spacing:2px; }

  /* ============ APP ============ */
  #app{ max-width:920px; margin:0 auto; padding:18px 16px 60px; }
  header.topbar{
    display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between;
    padding:12px 14px; background:var(--panel); border:1px solid #1c1c22; border-radius:12px; margin-bottom:20px;
  }
  header.topbar .brand{ font-weight:700; letter-spacing:2px; font-size:.95rem; }
  header.topbar button{
    background:#16161b; border:1px solid #1c1c22; color:var(--silver);
    padding:8px 12px; border-radius:8px; font-size:.75rem; cursor:pointer;
  }
  header.topbar button:hover{ border-color:var(--silver); }
  #status-text{ font-size:.72rem; color:var(--silver-dim); letter-spacing:1px; }

  section.orb-section{
    display:flex; flex-direction:column; align-items:center; gap:16px;
    padding:34px 10px; background:var(--panel); border:1px solid #1c1c22; border-radius:16px; margin-bottom:20px;
  }
  .orb{ position:relative; width:150px; height:150px; cursor:pointer; }
  .orb-core{
    position:absolute; inset:30px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #eef0f4, #8b8ea3 45%, #202028 100%);
    box-shadow:0 0 30px var(--glow), inset 0 0 20px rgba(0,0,0,.5);
  }
  .orb-ring{ position:absolute; inset:0; border-radius:50%; border:1px solid var(--silver-dim); opacity:0; }
  .orb.idle .orb-core{ animation: idlepulse 3.2s ease-in-out infinite; }
  @keyframes idlepulse{ 0%,100%{transform:scale(1);} 50%{transform:scale(1.05);} }
  .orb.listening .orb-ring{ animation: wave 1.6s ease-out infinite; border-color:var(--cyan); }
  .orb.listening .orb-ring.r2{ animation-delay:.6s; }
  @keyframes wave{ 0%{ transform:scale(.6); opacity:.7;} 100%{ transform:scale(1.5); opacity:0;} }
  .orb.thinking .orb-core{ animation: fastpulse .55s ease-in-out infinite; }
  @keyframes fastpulse{ 0%,100%{transform:scale(1);} 50%{transform:scale(1.1);} }
  .orb.speaking .orb-core{ animation: speakwave .9s ease-in-out infinite; box-shadow:0 0 46px var(--purple); }
  @keyframes speakwave{ 0%,100%{transform:scale(1);} 50%{transform:scale(1.07) rotate(1deg);} }

  .assistant-name{ font-weight:700; letter-spacing:3px; font-size:1rem; }
  .lines{ text-align:center; font-size:.85rem; min-height:44px; max-width:560px; }
  .lines .you{ color:var(--cyan); margin-bottom:4px; }
  .lines .jarvis{ color:var(--silver-bright); }

  .controls{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; align-items:center; width:100%; max-width:560px; }
  .controls input[type=text]{
    flex:1; min-width:180px; background:#0a0a0d; border:1px solid #1c1c22; color:var(--silver-bright);
    padding:10px 12px; border-radius:8px; font-size:.85rem;
  }
  .controls button{
    background:#16161b; border:1px solid #1c1c22; color:var(--silver);
    padding:10px 14px; border-radius:8px; cursor:pointer; font-size:.85rem;
  }
  .controls button:hover{ border-color:var(--silver); }

  /* ============ SECOND BRAIN ============ */
  section.brain-section{ background:var(--panel); border:1px solid #1c1c22; border-radius:16px; padding:16px; }
  .brain-topbar{ display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:8px; }
  .brain-title{ font-weight:700; font-size:.95rem; }
  .brain-sub{ font-size:.7rem; color:var(--silver-dim); }
  .brain-right{ display:flex; align-items:center; gap:10px; font-size:.72rem; color:var(--silver-dim); }
  .brain-right button{ background:#16161b; border:1px solid #1c1c22; color:var(--silver); border-radius:6px; padding:5px 9px; cursor:pointer; font-size:.85rem; }
  #graph-container{ width:100%; }
  #graph-container svg{ width:100%; height:auto; display:block; }
  .core-pulse{ transform-box:fill-box; transform-origin:center; animation:corepulse 2.4s ease-in-out infinite; }
  @keyframes corepulse{ 0%,100%{transform:scale(1);} 50%{transform:scale(1.08);} }
  .core-ring{ transform-box:fill-box; transform-origin:center; animation:coreringpulse 2.4s ease-in-out infinite; }
  @keyframes coreringpulse{ 0%,100%{opacity:.15; transform:scale(1);} 50%{opacity:.5; transform:scale(1.12);} }
  .node-ring{ transform-box:fill-box; transform-origin:center; animation:noderingbreathe 3.4s ease-in-out infinite; }
  @keyframes noderingbreathe{ 0%,100%{opacity:.12; transform:scale(1);} 50%{opacity:.55; transform:scale(1.15);} }
  .edge-flow{ stroke-dasharray:6 9; animation:dashmove 2.2s linear infinite; }
  @keyframes dashmove{ to{ stroke-dashoffset:-150; } }
  .note-node circle{ transition:filter .2s ease; }
  .note-node:hover circle{ filter:brightness(1.3); }
  .note-node.flash circle{ animation:flashnode .5s ease-in-out 3; }
  @keyframes flashnode{ 0%,100%{ filter:brightness(1); } 50%{ filter:brightness(2.2); } }

  .legend{ display:flex; flex-wrap:wrap; gap:10px 16px; margin-top:12px; align-items:center; font-size:.72rem; }
  .legend .dot{ display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:5px; vertical-align:middle; }
  .legend .item{ color:var(--silver-dim); }
  .legend .ok{ color:#10b981; margin-left:auto; }

  /* ============ MODAL ============ */
  #modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.65); z-index:200;
    display:flex; align-items:center; justify-content:center; padding:16px;
  }
  #modal{
    width:100%; max-width:420px; background:#0e0e12; border:1px solid #232329; border-radius:14px;
    padding:20px; display:flex; flex-direction:column; gap:12px;
  }
  #modal h3{ font-size:.95rem; letter-spacing:1px; }
  #modal label{ font-size:.72rem; color:var(--silver-dim); display:block; margin-bottom:4px; }
  #modal input, #modal select, #modal textarea{
    width:100%; background:#0a0a0d; border:1px solid #1c1c22; color:var(--silver-bright);
    padding:9px 10px; border-radius:8px; font-size:.85rem; font-family:inherit;
  }
  #modal textarea{ min-height:80px; resize:vertical; }
  .modal-actions{ display:flex; justify-content:space-between; gap:8px; margin-top:6px; }
  .modal-actions button{ padding:9px 14px; border-radius:8px; font-size:.8rem; cursor:pointer; border:1px solid #1c1c22; background:#16161b; color:var(--silver); }
  .modal-actions .save{ background:var(--silver-bright); color:#0a0a0d; font-weight:600; border:none; }
  .modal-actions .delete{ color:#ff6b6b; border-color:#3a1c1c; }


</style>
</head>
<body>

<!-- ============ BOOT ============ -->
<div id="boot-screen">
  <div class="boot-title mono">JARVIS</div>
  <div class="boot-line"></div>
  <div class="boot-sub mono">SINCRONIZANDO DADOS...</div>
  <div class="boot-footer mono">v5.0 · REBUILD</div>
</div>

<!-- ============ ACTIVATION ============ -->
<div id="activation-screen" class="hidden">
  <div class="act-title mono">JARVIS</div>
  <button id="activateBtn">► ATIVAR SISTEMA</button>
  <div class="act-hint mono">CLIQUE PARA INICIAR</div>
</div>

<!-- ============ APP ============ -->
<div id="app" class="hidden">
  <header class="topbar">
    <div class="brand mono">JARVIS</div>
    <div id="status-text">pronto</div>
  </header>

  <section class="orb-section">
    <div class="orb idle" id="orb" onclick="window.manualActivate()">
      <div class="orb-ring r1"></div>
      <div class="orb-ring r2"></div>
      <div class="orb-core"></div>
    </div>
    <div class="assistant-name mono">JARVIS</div>
    <div class="lines">
      <div class="you" id="you-line"></div>
      <div class="jarvis" id="jarvis-line"></div>
    </div>
    <div class="controls">
      <input type="text" id="textInput" placeholder="ou digite e tecle Enter">

    </div>
  </section>

  <section class="brain-section">
    <div class="brain-topbar">
      <div>
        <div class="brain-title">🧠 SECOND BRAIN</div>
        <div class="brain-sub">contexto vivo da vida do Zago</div>
      </div>
      <div class="brain-right">
        <span id="sb-count">0 notas · 0 áreas</span>
        <button id="addNoteBtn" title="Nova nota">＋</button>

      </div>
    </div>
    <div id="graph-container"></div>
    <div class="legend" id="legend"></div>
  </section>
</div>

<!-- ============ MODAL ============ -->
<div id="modal-overlay" class="hidden">
  <div id="modal">
    <h3 id="modal-title">Nova nota</h3>
    <div>
      <label>Título</label>
      <input type="text" id="m-title">
    </div>
    <div>
      <label>Área</label>
      <select id="m-area"></select>
    </div>
    <div>
      <label>Conteúdo</label>
      <textarea id="m-body"></textarea>
    </div>
    <div class="modal-actions">
      <button class="delete hidden" id="m-delete">Excluir</button>
      <div style="flex:1"></div>
      <button id="m-cancel">Cancelar</button>
      <button class="save" id="m-save">Salvar</button>
    </div>
  </div>
</div>

<script>
/* ==================================================================
   CONFIG — respostas da entrevista embutidas
   ================================================================== */
const CONFIG = {
  name: "Jarvis",
  address: "Zago",
  themeColor: "#b8bfc9",
  persona: "analista, curioso, inteligente, programador, criterioso e sarcástico",
  wakeWord: "fala jarvis",
  voiceGender: "masculina",
  model: "claude-sonnet-5"
};

// Em desenvolvimento local, rode o backend com `uvicorn main:app --reload`
// e troque para "http://localhost:8000".
const BACKEND_URL = "https://jarvis-adams.onrender.com";

const AREA = {
  metas:       { label:"Metas",        color:"#fbbf24" },
  trabalho:    { label:"Carreira",     color:"#ff5547" },
  projetos:    { label:"Projetos",     color:"#8b7cff" },
  financas:    { label:"Finanças",     color:"#f7931a" },
  aprendizado: { label:"Aprendizado",  color:"#2dd4ff" },
  saude:       { label:"Saúde",        color:"#10b981" },
  relacoes:    { label:"Relações",     color:"#ec4899" },
  meta:        { label:"Você",         color:"#8a90a6" }
};

const DEFAULT_NOTES = [
  { id:"n1",  area:"meta",        title:"Zago",              body:"Adams Willians Alencar Zago, 47 anos (nasc. 23/04/1979), brasileiro, casado. Coordenador de Soluções e Inovação em TI no Grupo Maqnelson, Uberlândia-MG." },

  { id:"n2",  area:"metas",       title:"Financeiro",        body:"Curto prazo: organizar a vida financeira." },
  { id:"n3",  area:"metas",       title:"Impressão 3D",      body:"Curto prazo: gerar renda extra com produtos impressos em 3D." },
  { id:"n4",  area:"metas",       title:"Terrenos",          body:"Curto prazo: vender dois terrenos em Tupaciguara." },
  { id:"n5",  area:"metas",       title:"Longo Prazo",       body:"Ser promovido, conseguir um salário muito bom e, em 10 anos, aposentar vivendo de soluções próprias como empreendedor." },

  { id:"n6",  area:"trabalho",    title:"Maqnelson",         body:"Coordenador de Soluções e Inovação em TI no Grupo Maqnelson. Foco total em liderar a transformação digital com IA e construir uma esteira de CI/CD com agentes virtuais além dos devs do time." },

  { id:"n7",  area:"projetos",    title:"Transf. Digital",   body:"Liderar a transformação digital do Grupo Maqnelson." },
  { id:"n8",  area:"projetos",    title:"Bambu Lab A1",      body:"Transformar a impressora 3D Bambu Lab A1 em uma fonte de renda." },
  { id:"n9",  area:"projetos",    title:"Crossfit",          body:"Retornar ao Crossfit e gerar o hábito." },
  { id:"n10", area:"projetos",    title:"Beach Tennis",      body:"Treinar beach tennis." },
  { id:"n11", area:"projetos",    title:"Tênis",             body:"Jogar mais tênis." },
  { id:"n12", area:"projetos",    title:"Pós em IA",         body:"Terminar a pós-graduação em IA para lideranças." },
  { id:"n13", area:"projetos",    title:"Vida Financeira",   body:"Equilibrar a vida financeira." },

  { id:"n14", area:"financas",    title:"Dívidas & Reserva", body:"Pagar dívidas, quitar o apartamento e construir reserva de emergência." },

  { id:"n15", area:"aprendizado", title:"Pós IA",             body:"Cursando pós-graduação em IA, gestão de agentes e IA para produtividade e liderança." },
  { id:"n16", area:"aprendizado", title:"Rápido e Devagar",   body:"Lendo 'Rápido e Devagar: Duas Formas de Pensar', de Daniel Kahneman." },
  { id:"n17", area:"aprendizado", title:"Outlive",            body:"Próxima leitura: 'Outlive', de Peter Attia." },

  { id:"n18", area:"saude",       title:"Hábito Crossfit",    body:"Retomar o Crossfit como hábito consistente." },
  { id:"n19", area:"saude",       title:"Saúde Mental",       body:"Cuidar da saúde mental — sentindo falta de foco." },
  { id:"n20", area:"saude",       title:"Pressão Alta",       body:"Pressão arterial um pouco alta — atenção necessária." },
  { id:"n21", area:"saude",       title:"Rotina de Exercícios", body:"Melhorar a rotina de exercícios: caminhada, pedalada, Crossfit, tênis e beach tennis." },

  { id:"n22", area:"relacoes",    title:"Jesebel",            body:"Esposa, fisioterapeuta. Base estrutural da vida do Zago." },
  { id:"n23", area:"relacoes",    title:"Davi & Giovanna",    body:"Filhos: Davi (24 anos) e Giovanna (10 anos)." },
  { id:"n24", area:"relacoes",    title:"Tia Solange",        body:"Tia Solange — como uma mãe." }
];

const DEFAULT_REL = [
  ["n1","n6"],["n1","n5"],["n1","n22"],["n1","n23"],["n1","n24"],
  ["n5","n6"],["n5","n7"],["n5","n2"],
  ["n2","n14"],["n2","n13"],["n2","n4"],
  ["n3","n8"],
  ["n6","n7"],["n6","n15"],
  ["n7","n15"],
  ["n12","n15"],
  ["n9","n18"],["n9","n21"],
  ["n10","n21"],["n11","n21"],
  ["n13","n14"],
  ["n19","n21"],["n19","n1"],
  ["n20","n21"],["n20","n19"],
  ["n16","n15"],["n16","n19"],
  ["n17","n15"],["n17","n21"],
  ["n22","n23"]
];

/* ==================================================================
   ESTADO — agora vem do backend (Postgres), não mais do localStorage
   ================================================================== */
let NOTES = DEFAULT_NOTES.slice(); // preenchido de verdade por loadStateFromBackend()
let REL   = DEFAULT_REL.slice();

async function loadStateFromBackend(){
  try{
    const [notesRes, relRes] = await Promise.all([
      fetch(`${BACKEND_URL}/notes`),
      fetch(`${BACKEND_URL}/relations`)
    ]);
    if(notesRes.ok) NOTES = await notesRes.json();
    if(relRes.ok){
      const rels = await relRes.json();
      REL = rels.map(r => [r.note_a, r.note_b]);
    }
  }catch(e){
    setStatus("não consegui falar com o backend — usando dados locais de fallback");
  }
  renderGraph();
}

let sessionHistory = [];
let listening=false, busy=false, wakeActive=false;
let recognition=null;
let voices=[];
let currentEdgesForPulses=[];
let pulseState=[];

/* ==================================================================
   UTIL
   ================================================================== */
function normalize(s){
  return String(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();
}
function escapeXML(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
const WAKE_NORM = normalize(CONFIG.wakeWord);

function setStatus(t){ document.getElementById("status-text").textContent = t; }
function setOrbState(state){
  const orb = document.getElementById("orb");
  orb.className = "orb " + state;
}
function setTranscript(you, jarvis){
  if(you !== null && you !== undefined) document.getElementById("you-line").textContent = you ? ("Você: " + you) : "";
  document.getElementById("jarvis-line").textContent = jarvis ? ("Jarvis: " + jarvis) : "";
}

/* ==================================================================
   BOOT SEQUENCE
   ================================================================== */
window.addEventListener("DOMContentLoaded", () => {
  setTimeout(() => {
    const boot = document.getElementById("boot-screen");
    boot.classList.add("fade-out");
    setTimeout(() => {
      boot.style.display = "none";
      document.getElementById("activation-screen").classList.remove("hidden");
    }, 500);
  }, 2200);
});

document.getElementById("activateBtn").addEventListener("click", () => {
  document.getElementById("activation-screen").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");

  initRecognition();
  loadStateFromBackend();
  requestAnimationFrame(animatePulses);

  const greet = `Sistemas online. Estou ouvindo, ${CONFIG.address}.`;
  setTranscript("", greet);
  speak(greet);
});

/* ==================================================================
   VOZ — RECONHECIMENTO (STT)
   ================================================================== */
function initRecognition(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){
    setStatus("reconhecimento de voz não suportado neste navegador");
    return;
  }
  recognition = new SR();
  recognition.lang = "pt-BR";
  recognition.continuous = true;
  recognition.interimResults = false;

  recognition.onresult = handleResult;
  recognition.onerror = handleRecoError;
  recognition.onend = () => {
    listening = false;
    if(!busy){ startListening(); }
  };

  startListening();
}

function startListening(){
  if(!recognition || listening) return;
  try{
    recognition.start();
    listening = true;
    setOrbState("listening");
    setStatus(wakeActive ? "aguardando comando..." : `diga "${CONFIG.wakeWord}"`);
  }catch(e){
    // já iniciado — ignora
  }
}

function handleRecoError(e){
  if(e.error === "not-allowed"){
    setStatus("permissão de microfone negada — libere o microfone nas configurações do navegador");
    speak("Não consigo acessar o microfone. Libere a permissão nas configurações do navegador.");
  } else if(e.error === "no-speech"){
    // silencioso, apenas reinicia via onend
  } else {
    setStatus("erro no reconhecimento de voz: " + e.error);
  }
}

function handleResult(event){
  const res = event.results[event.results.length - 1];
  const text = res[0].transcript.trim();
  if(!text) return;
  const norm = normalize(text);

  if(!wakeActive){
    if(norm.includes(WAKE_NORM)){
      wakeActive = true;
      const idx = norm.indexOf(WAKE_NORM);
      const remainder = text.slice(idx + CONFIG.wakeWord.length).trim();
      if(remainder.length > 2){
        wakeActive = false;
        processCommand(remainder);
      } else {
        setStatus("pode falar...");
      }
    }
    return;
  } else {
    wakeActive = false;
    processCommand(text);
  }
}

window.manualActivate = function(){
  if(busy) return;
  wakeActive = true;
  setStatus("pode falar...");
  if(!listening) startListening();
};

/* ==================================================================
   VOZ — SÍNTESE (TTS)
   ================================================================== */
function loadVoices(){ voices = speechSynthesis.getVoices(); }
loadVoices();
if("onvoiceschanged" in speechSynthesis){ speechSynthesis.onvoiceschanged = loadVoices; }

function pickVoice(){
  const pt = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith("pt"));
  if(pt.length === 0) return null;
  const male = pt.find(v => /male|homem|ricardo|daniel|felipe|antonio|thiago/i.test(v.name));
  return male || pt[0];
}

function speak(text){
  if(!text) return;
  busy = true;
  setOrbState("speaking");
  try{ recognition && recognition.abort && listening && recognition.stop(); }catch(e){}

  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = "pt-BR";
  const v = pickVoice();
  if(v) utter.voice = v;

  utter.onend = () => {
    busy = false;
    setOrbState("idle");
    startListening();
  };
  utter.onerror = () => {
    busy = false;
    setOrbState("idle");
    startListening();
  };

  speechSynthesis.speak(utter);
}

document.getElementById("stopBtn").addEventListener("click", () => {
  speechSynthesis.cancel();
  busy = false;
  setOrbState("idle");
  startListening();
});
document.getElementById("micBtn").addEventListener("click", () => window.manualActivate());

/* ==================================================================
   CÉREBRO — CHAMADA À API DO CLAUDE
   ================================================================== */
document.getElementById("textInput").addEventListener("keydown", (e) => {
  if(e.key === "Enter"){
    const val = e.target.value.trim();
    if(val){ e.target.value = ""; processCommand(val); }
  }
});

async function processCommand(text){
  setTranscript(text, "");
  busy = true;
  setOrbState("thinking");
  setStatus("pensando...");

  try{
    const res = await fetch(`${BACKEND_URL}/chat`, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ message: text, history: sessionHistory })
    });

    if(!res.ok){
      const msg = "Deu erro no backend. Confere se ele está no ar.";
      setTranscript(text, msg);
      speak(msg);
      return;
    }

    const data = await res.json();
    const reply = data.reply || "Não recebi resposta. Tenta de novo.";

    sessionHistory.push({ role:"user", content:text });
    sessionHistory.push({ role:"assistant", content:reply });

    if(data.saved_note){
      await loadStateFromBackend();
      flashNode(data.saved_note.id);
    }

    setTranscript(text, reply);
    setStatus("pronto");
    speak(reply);
  }catch(err){
    const msg = "Não consegui conectar ao backend. Verifica se ele está rodando e sua internet.";
    setTranscript(text, msg);
    speak(msg);
  }
}

function flashNode(id){
  setTimeout(() => {
    const g = document.getElementById("node-" + id);
    if(g && g.parentElement){
      g.parentElement.classList.add("flash");
      setTimeout(() => g.parentElement && g.parentElement.classList.remove("flash"), 1600);
    }
  }, 50);
}

/* ==================================================================
   SECOND BRAIN — GRAFO NEURAL ANIMADO
   ================================================================== */
function computeLayout(notes){
  const cx=500, cy=270, rx=390, ry=205;
  const n = notes.length;
  return notes.map((note,i) => {
    const angle = (i / n) * Math.PI * 2 - Math.PI/2;
    return { ...note, x: cx + rx*Math.cos(angle), y: cy + ry*Math.sin(angle) };
  });
}

function renderGraph(){
  const layout = computeLayout(NOTES);
  const byId = {};
  layout.forEach(n => byId[n.id] = n);

  const degree = {};
  REL.forEach(([a,b]) => { degree[a]=(degree[a]||0)+1; degree[b]=(degree[b]||0)+1; });

  let rays="", rings="", nodes="", edges="";
  currentEdgesForPulses = [];

  REL.forEach(([a,b]) => {
    const A = byId[a], B = byId[b];
    if(!A || !B) return;
    const midx=(A.x+B.x)/2, midy=(A.y+B.y)/2;
    const cx = midx + (500-midx)*0.35, cy = midy + (270-midy)*0.35;
    edges += `<path d="M ${A.x} ${A.y} Q ${cx} ${cy} ${B.x} ${B.y}" stroke="url(#edgeGrad)" stroke-width="1.3" fill="none" class="edge-flow" opacity="0.5"/>`;
    currentEdgesForPulses.push({ A:{x:A.x,y:A.y}, C:{x:cx,y:cy}, B:{x:B.x,y:B.y} });
  });

  layout.forEach((n,i) => {
    const color = (AREA[n.area] || AREA.meta).color;
    const deg = degree[n.id] || 0;
    const r = Math.min(13 + deg*1.6, 30);
    rays += `<line x1="500" y1="270" x2="${n.x}" y2="${n.y}" stroke="${color}" stroke-width="1" opacity="0.15"/>`;
    rings += `<circle cx="${n.x}" cy="${n.y}" r="${r+7}" fill="none" stroke="${color}" stroke-width="1.2" class="node-ring" style="animation-delay:${(i%6)*0.3}s" opacity="0.5"/>`;
    nodes += `<g class="note-node" onclick="window.editNote('${n.id}')">
      <circle cx="${n.x}" cy="${n.y}" r="${r}" fill="${color}" filter="url(#glow)" id="node-${n.id}"/>
      <text x="${n.x}" y="${n.y + r + 15}" text-anchor="middle" fill="#e8eaf0" font-size="10.5" font-family="system-ui,sans-serif">${escapeXML(n.title)}</text>
    </g>`;
  });

  let pulses = "";
  for(let i=0;i<12;i++){
    pulses += `<circle class="pulse" r="3" fill="#f4f6fa" opacity="0.85" filter="url(#glow)" id="pulse-${i}" cx="500" cy="270"/>`;
  }

  const svgStr = `<svg viewBox="0 0 1000 540" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="coreGrad" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#eef0f4"/>
        <stop offset="45%" stop-color="#8b7cff"/>
        <stop offset="100%" stop-color="#2a2350"/>
      </radialGradient>
      <linearGradient id="edgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#8b7cff"/>
        <stop offset="100%" stop-color="#2dd4ff"/>
      </linearGradient>
      <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
        <feGaussianBlur stdDeviation="3.5" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
    ${rays}
    ${edges}
    ${rings}
    <circle cx="500" cy="270" r="46" fill="url(#coreGrad)" filter="url(#glow)" class="core-pulse"/>
    <circle cx="500" cy="270" r="60" fill="none" stroke="#b8bfc9" stroke-width="1.3" opacity="0.35" class="core-ring"/>
    <text x="500" y="279" text-anchor="middle" font-size="28">🧠</text>
    ${nodes}
    ${pulses}
  </svg>`;

  document.getElementById("graph-container").innerHTML = svgStr;

  initPulses();
  updateCounters();
  renderLegend();
}

function initPulses(){
  pulseState = [];
  if(currentEdgesForPulses.length === 0) return;
  for(let i=0;i<12;i++){
    pulseState.push({
      edge: Math.floor(Math.random()*currentEdgesForPulses.length),
      t: Math.random(),
      speed: 0.004 + Math.random()*0.004
    });
  }
}

function animatePulses(){
  if(currentEdgesForPulses.length > 0){
    pulseState.forEach((p,i) => {
      p.t += p.speed;
      if(p.t > 1){
        p.t = 0;
        p.edge = Math.floor(Math.random()*currentEdgesForPulses.length);
      }
      const e = currentEdgesForPulses[p.edge];
      if(!e) return;
      const x = (1-p.t)**2*e.A.x + 2*(1-p.t)*p.t*e.C.x + p.t**2*e.B.x;
      const y = (1-p.t)**2*e.A.y + 2*(1-p.t)*p.t*e.C.y + p.t**2*e.B.y;
      const el = document.getElementById("pulse-" + i);
      if(el){
        el.setAttribute("cx", x);
        el.setAttribute("cy", y);
        el.setAttribute("opacity", (0.25 + 0.65*Math.sin(p.t*Math.PI)).toFixed(2));
      }
    });
  }
  requestAnimationFrame(animatePulses);
}

function updateCounters(){
  const areas = new Set(NOTES.map(n => n.area));
  document.getElementById("sb-count").textContent = `${NOTES.length} notas · ${areas.size} áreas`;
}

function renderLegend(){
  const areas = [...new Set(NOTES.map(n => n.area))];
  let html = areas.map(k => {
    const a = AREA[k] || AREA.meta;
    return `<span class="item"><span class="dot" style="background:${a.color}"></span>${a.label}</span>`;
  }).join("");
  html += `<span class="ok">✓ contexto injetado em todos os comandos do ${CONFIG.name}</span>`;
  document.getElementById("legend").innerHTML = html;
}

/* ==================================================================
   EDITOR DE NOTAS
   ================================================================== */
function populateAreaSelect(selected){
  const sel = document.getElementById("m-area");
  sel.innerHTML = Object.keys(AREA).map(k =>
    `<option value="${k}" ${k===selected ? "selected":""}>${AREA[k].label}</option>`
  ).join("");
}

let editingId = null;

window.editNote = function(id){
  editingId = id;
  const note = NOTES.find(n => n.id === id);
  if(!note) return;
  document.getElementById("modal-title").textContent = "Editar nota";
  document.getElementById("m-title").value = note.title;
  document.getElementById("m-body").value = note.body;
  populateAreaSelect(note.area);
  document.getElementById("m-delete").classList.remove("hidden");
  document.getElementById("modal-overlay").classList.remove("hidden");
};

window.addNote = function(){
  editingId = null;
  document.getElementById("modal-title").textContent = "Nova nota";
  document.getElementById("m-title").value = "";
  document.getElementById("m-body").value = "";
  populateAreaSelect("projetos");
  document.getElementById("m-delete").classList.add("hidden");
  document.getElementById("modal-overlay").classList.remove("hidden");
};

document.getElementById("addNoteBtn").addEventListener("click", () => window.addNote());
document.getElementById("reloadBtn").addEventListener("click", () => loadStateFromBackend());

document.getElementById("m-cancel").addEventListener("click", () => {
  document.getElementById("modal-overlay").classList.add("hidden");
});

document.getElementById("m-save").addEventListener("click", async () => {
  const title = document.getElementById("m-title").value.trim();
  const area = document.getElementById("m-area").value;
  const body = document.getElementById("m-body").value.trim();
  if(!title || !body) return;

  try{
    if(editingId){
      await fetch(`${BACKEND_URL}/notes/${editingId}`, {
        method: "PUT",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ area, title, body })
      });
    } else {
      await fetch(`${BACKEND_URL}/notes`, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ area, title, body })
      });
    }
    document.getElementById("modal-overlay").classList.add("hidden");
    await loadStateFromBackend();
  }catch(e){
    setStatus("erro ao salvar a nota no backend");
  }
});

document.getElementById("m-delete").addEventListener("click", async () => {
  if(!editingId) return;
  try{
    await fetch(`${BACKEND_URL}/notes/${editingId}`, { method: "DELETE" });
    document.getElementById("modal-overlay").classList.add("hidden");
    await loadStateFromBackend();
  }catch(e){
    setStatus("erro ao excluir a nota no backend");
  }
});
</script>
